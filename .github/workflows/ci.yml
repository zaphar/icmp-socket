name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: cargo --version && rustc --version

      - name: Build (default features)
        run: cargo build --all-targets

      - name: Test (default features)
        run: cargo test

      # Validate the datagram receive path against the real kernel on each OS.
      # This is what proves parse_auto handles both the Linux (no IP header)
      # and macOS (IP header included) delivery behaviors, rather than trusting
      # a single developer's machine.
      - name: Allow unprivileged ICMP datagram sockets (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      # Run serially: these tests share the loopback interface, and macOS
      # datagram sockets share identifier 0, so replies are not demuxed between
      # concurrent sockets.
      - name: Loopback ping smoke test
        run: cargo test --test loopback_ping -- --ignored --test-threads=1

      # Raw sockets need root. A cargo runner runs only the raw test binary
      # under sudo, so the build stays unprivileged.
      - name: Raw socket loopback test (root)
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${host}_RUNNER=sudo -E"
          cargo test --test raw_loopback -- --ignored --test-threads=1

  # The crate promises rust-version in Cargo.toml. Build the library with
  # exactly that toolchain. Tests are not run here: dev-dependencies may need
  # a newer toolchain.
  msrv:
    name: msrv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the minimum supported toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Build the library (all features)
        run: cargo "+$MSRV" build --lib --all-features
