[package]
name = "icmp-socket"
description = "ICMP sockets for both IPv4 and IPv6"
version = "1.0.0"
repository = "https://github.com/zaphar/icmp-socket"
authors = ["Jeremy Wall <jeremy@marzhillstudios.com>"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0.2.191"

[dependencies.socket2]
version = "0.6.5"
features=[ "all" ]

[dependencies.tokio]
version = "1.54"
optional = true
features = ["net"]

[dependencies.async-io]
version = "2.6"
optional = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(kani)"] }

# Document the feature-gated items (async sockets, runtimes) on docs.rs, and
# label each with the feature it needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
proptest = "1"
socket2 = "0.6.5"
tokio = { version = "1.54", features = ["net", "rt", "macros", "time"] }
async-io = "2.6"

[features]
default = []
# The async socket types (AsyncRawSocket4, ...) and the Runtime trait.
async = []
# The tokio runtime adapter.
tokio = ["async", "dep:tokio"]
# The async-io runtime adapter.
async-io = ["async", "dep:async-io"]

[[example]]
name = "async_ping4"
required-features = ["tokio"]
