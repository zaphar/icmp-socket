[package]
name = "icmp-socket"
description = "ICMP sockets for both IPv4 and IPv6"
version = "0.3.1"
repository = "https://github.com/zaphar/icmp-socket"
authors = ["Jeremy Wall <jeremy@marzhillstudios.com>"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.3.4"

[dependencies.socket2]
version = "0.4.4"
features=[ "all" ]

[dependencies.smol]
version = "1.3.0"
optional = true

[dependencies.async-trait]
version = "0.1.74"
optional = true

[dev-dependencies]
proptest = "1"

[features]
default = []
smol = ["dep:smol", "dep:async-trait"]

[[example]]
name = "async_ping4"
required-features = ["smol"]
